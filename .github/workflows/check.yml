name: Checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The pinned TinyDesk files are unchanged
        run: python tools/sync_tinydesk.py --check
      - name: Editor and generator
        run: |
          node --check app.js
          node --test tests/*.test.cjs
      - name: Exports against the firmware's tdui.py
        run: |
          python tests/verify_export.py
          python tests/verify_pixels.py
          python tests/verify_controls.py
          python tests/verify_bridge.py
